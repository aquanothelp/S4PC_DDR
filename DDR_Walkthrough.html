function graph(box) {

      ${S.buf[id] ? `<g transform="translate(${p.x + nw - 20},${p.y + 9})"><rect width="10" height="12" style="fill:var(--z-g)"/><rect y="12" width="10" height="12" style="fill:var(--z-y)"/><rect y="24" width="10" height="12" style="fill:var(--z-r)"/></g>` : ""}</g>`;

function runProposals() {

    let n = 0, a = 0, s = 0;
    let u = 0;
    ids.forEach(id => {
      if (S.susp[id]) { s++; return; }
      if (!S.efg[id]) { u++; return; }
      const x = makeProp(id);
      if (S.auto && x.within) { x.st = "Adopted"; x.mode = "A"; S.buf[id] = { ss: x.ss, rop: x.rop, max: x.max }; a++; } else n++;
      S.prop[id] = x;
    });
    S.bjobs.unshift({ n: `Buffer Proposal Calculation ${S.bjobs.length + 1}`, log: `${n} new, ${a} adopted automatically, ${s} suspended${u ? `, ${u} skipped (no lead time classification)` : ""}` });
    return `${n + a} proposals created`;
}

// Net flow equation (SAP Help, Planning Procedure): On-Hand + Open Supply − Open Past (incl. Today's) Demand − Qualified Spike Demand
function nfp(id) {
  const k = STK[id], b = S.buf[id], ps = S.pspk[id] || {}, D = dlt(id);
  const pp = { shc: ps.shc ?? S.plantPar.shc, shm: ps.shm ?? S.plantPar.shm, stf: ps.stf ?? S.plantPar.stf, prod: Object.keys(ps).length > 0 };
  const thr = pp.stf / 100 * b.ss, hz = Math.ceil(pp.shm * D + pp.shc);
  const os = k.rec.reduce((s, r) => s + r.q, 0);
  const spikes = Object.entries(k.dem).map(([d, q]) => ({ d: +d, q, ok: q > thr && +d <= hz }));
  const qs = spikes.filter(x => x.ok).reduce((s, x) => s + x.q, 0);
  const n = k.oh + os - k.od - qs;
  const zone = n <= b.ss ? "Red" : n <= b.rop ? "Yellow" : n <= b.max ? "Green" : "Above Max";
  return { ...k, os, thr, hz, spikes, qs, n, zone, pr: n / b.max * 100, prop: n < b.rop ? b.max - n : 0, D, b, pp };
}
const zc = z => z === "Red" ? "--z-r" : z === "Yellow" ? "--z-y" : z === "Green" ? "--z-g" : "--z-b";
const zk = z => z === "Red" ? "r" : z === "Yellow" ? "y" : z === "Green" ? "g" : "b";

function bbar(b, v) {
  const top = b.max * 1.2, w = q => (q / top * 100).toFixed(1) + "%";
  return `<span class="bbar" title="NFP ${f(v)}"><i style="width:${w(b.ss)};background:var(--z-r)"></i><i style="width:${w(b.rop - b.ss)};background:var(--z-y)"></i><i style="width:${w(b.max - b.rop)};background:var(--z-g)"></i><i style="width:${w(top - b.max)};background:var(--z-b);opacity:.35"></i><em style="left:calc(${Math.max(0, Math.min(v, top)) / top * 100}% - 1px)"></em></span>`;
}
function createSupply(id, q, d) {
  const x = nfp(id); if (!x.prop || by[id].blocked) return false;
  q = q || x.prop; d = d || x.D;
  STK[id].rec.push({ d, q, created: true });
  S.created.unshift({ id, t: SUPPLY[by[id].pt], q, d: day(d), from: x.n });
  return true;
}
// projected on-hand: on-hand − daily demand (open demand on that day, else ADU) + receipts
function project(id, days) {
  const k = STK[id], adu = by[id].adu * (S.daf[id] || 1); let v = k.oh; const out = [];
  for (let d = 1; d <= days; d++) { v += k.rec.filter(r => r.d === d).reduce((s, r) => s + r.q, 0) - (k.dem[d] || adu); out.push(v); }
  return out;
}
function spark(vals, ss, w = 140, h = 30) {

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${sy(ss)}" y2="${sy(ss)}" style="stroke:var(--z-r);stroke-dasharray:3 2"/><line x1="0" x2="${w}" y1="${sy(0)}" y2="${sy(0)}" style="stroke:var(--line)"/><polyline points="${vals.map((v, i) => `${(i * sx).toFixed(1)},${sy(v).toFixed(1)}`).join(" ")}" style="fill:none;stroke:var(--link);stroke-width:1.5"/></svg>`;
}

const fltIds = ids => S.flt ? ids.filter(id => S.flt.ids.includes(id)) : ids;

  <div class="tw"><table><tr><th>Product</th><th>Planning Priority</th><th>Buffer Levels</th><th class="n">Net Flow Position</th><th class="n">Reorder Point</th><th class="n">Max Stock</th><th class="n">Proposed Quantity</th><th>Supply Element</th></tr>

  <div class="card"><div class="tb"><h2>${oid(S.rpSel)}</h2></div><div class="tabs" role="tablist">${["Time-Dependent Buffer Levels", "BOM"].map(t => `<button role="tab" aria-selected="${S.rpTab === t}" data-rt="${t}">${t}</button>`).join("")}</div><div class="panel" style="padding-top:12px">${by[S.rpSel].blocked ? `<div class="strip warn">Product status is blocked for MRP. Create Supply and Expedite Supply are not available.</div>` : ""}${x.pp.prod ? `<div class="strip info">Product-specific spike parameters apply (Mass Maintenance of Products (DD)).</div>` : ""}

function rDetail(id) {

function tdChart(id, days) {
  const b = S.buf[id], n = days || Math.max(Math.round(dlt(id) * dmOf(id).f), 5), pr = [STK[id].oh, ...project(id, n)], W = 1000, H = 240, L = 8, R = 120;
  const top = Math.max(b.max * 1.2, ...pr), bot = Math.min(0, ...pr), y = v => 12 + (top - v) / (top - bot) * (H - 44), x = i => L + i / n * (W - L - R);
  let s = `<div class="graph"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Time-dependent buffer levels with projected stock">`;
  [[b.max, top, "--z-b", ""], [b.rop, b.max, "--z-g", "Max Stock " + f(b.max)], [b.ss, b.rop, "--z-y", "Reorder Point " + f(b.rop)], [bot, b.ss, "--z-r", "Safety Stock " + f(b.ss)]].forEach(([lo, hi, c, t]) => {
    s += `<rect x="${L}" y="${y(hi)}" width="${W - L - R}" height="${Math.max(0, y(lo) - y(hi))}" style="fill:var(${c});opacity:.18"/>`;
    if (t) s += `<line x1="${L}" x2="${W - R}" y1="${y(hi)}" y2="${y(hi)}" style="stroke:var(${c});stroke-width:1.5"/><text x="${W - R + 8}" y="${y(hi) + 4}" style="fill:var(--muted);font:12px var(--f)">${t}</text>`;
  });
  s += `<path d="M${x(0)},${y(pr[0])} ${pr.map((v, i) => `L${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")} L${x(n)},${y(bot)} L${x(0)},${y(bot)} Z" style="fill:var(--link);opacity:.08"/>`;
  s += `<polyline points="${pr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" style="fill:none;stroke:var(--link);stroke-width:2.5;stroke-linejoin:round"/>`;
  s += `<circle cx="${x(0)}" cy="${y(pr[0])}" r="4.5" style="fill:var(--link);stroke:var(--surface);stroke-width:2"/>`;
  for (let d = 0; d <= n; d += (n > 12 ? 5 : 1)) s += `<line x1="${x(d)}" x2="${x(d)}" y1="${H - 30}" y2="${H - 26}" style="stroke:var(--muted)"/><text x="${x(d)}" y="${H - 12}" text-anchor="${d ? "middle" : "start"}" style="fill:var(--muted);font:12px var(--f)">${d ? day(d) : "Today"}</text>`;
  return s + `</svg></div>`;

  ${ids.map(id => { const k = STK[id], b = S.buf[id], pct = k.oh / b.ss * 100, nx = [...k.rec].sort((a, c) => a.d - c.d)[0], st = k.oh <= 0 ? "Stockout" : k.oh < b.ss ? "Below Safety Stock" : "OK";

  ct.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { const r = [...STK[b.dataset.ex].rec].sort((a, c) => a.d - c.d)[0]; r.d = 1; toast(`Receipt for ${b.dataset.ex} expedited to ${day(1)}`); go(cur); });

/* Projected On-Hand Alerts */
function poa(fb, ct) {
  fb.innerHTML = fbStd(`<label class="fld">Alert<select><option></option><option>Stockout Alert</option><option>Safety Stock Alert</option><option>Threshold Alert</option></select></label>`);
  const rows = [];
  planIds().forEach(id => {
    const b = S.buf[id], D = dlt(id), pr = project(id, D), thr = S.plantPar.ohf / 100 * b.ss;
    const first = test => { const i = pr.findIndex(test); return i < 0 ? null : i + 1; };
    [["Stockout Alert", v => v <= 0], ["Threshold Alert", v => v < thr], ["Safety Stock Alert", v => v < b.ss]].some(([t, fn]) => {
      const d = first(fn); if (d) { rows.push({ id, t, d, v: pr[d - 1], b, thr, D, pr }); return true; } return false;
    });
  });

  ${S.poSel && rows.some(r => r.id === S.poSel) ? `<div class="card"><div class="tb"><h2>${oid(S.poSel)}</h2><span class="sp"></span>${chip("n", "Alert chart: today to DLT")}</div><div class="panel">${tdChart(S.poSel, dlt(S.poSel))}</div></div>` : ""}
  ${note("Step 5", `Shows stock alerts before replenishment happens, within the DLT: the first date stock falls below safety stock, below the threshold, or out of stock. In this mock the threshold is ${S.plantPar.ohf}% × Safety Stock (On-Hand Alert Threshold Factor); SAP Help doesn't define the formula. Only the most severe alert per product is listed.`, SRC3.poa)}`;

/* Historical Buffer Performance */
function hbp(fb, ct) {
  if (!S.aor.length) { fb.innerHTML = ""; ct.innerHTML = `<div class="strip warn">Assign a Plant / MRP Controller combination in Area of Responsibility (user menu → App Settings) to load data.</div>`; return; }

function hbDetail(r, Z, ZC) {
  const legend = `<div class="legend note" style="border:0;padding:0">${Z.map((z, i) => `<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(${ZC[i]});margin-right:4px"></i>${z} ${r.cnt[i]}</span>`).join(" · ")}</div>`;

  } else {
    // group days into calendar months or 7-day weeks, stacked by zone
    const groups = [];
    r.h.forEach((d, i) => {
      const dt = new Date(TODAY); dt.setDate(dt.getDate() - (r.h.length - i));
      const key = S.hbView === "Month-Wise" ? dt.toLocaleDateString("en-GB", { month: "short", year: "numeric" }) : "Week of " + (() => { const m = new Date(dt); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }); })();

  }

}
function dayTable(r, Z) {
  const b = S.buf[r.id];
  return `<div class="tw" style="max-height:320px;overflow-y:auto"><table><tr><th>Date</th><th>Stock Status</th><th class="n">Stock</th><th class="n">Max Stock</th><th class="n">Reorder Point</th><th class="n">Safety Stock</th></tr>${r.h.map((d, i) => `<tr><td>${day(i - r.h.length)}</td><td>${chip(["r", "y", "g", "y", "r", "b"][d.z], Z[d.z])}</td><td class="n">${f(d.v)}</td><td class="n">${f(b.max)}</td><td class="n">${f(b.rop)}</td><td class="n">${f(b.ss)}</td></tr>`).join("")}</table></div>`;

function dayWise(r, Z, ZC) {

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Day-wise stock levels">`;

  r.h.forEach((d, i) => { s += `<rect x="${i * bw + 1}" y="${y(d.v)}" width="${Math.max(1, bw - 2)}" height="${H - 24 - y(d.v)}" rx="1.5" style="fill:var(${ZC[d.z]})"><title>Day ${i + 1 - r.h.length}: ${f(d.v)} (${Z[d.z]})</title></rect>`; });
  s += `<text x="0" y="${H - 6}" style="fill:var(--muted);font:12px var(--f)">${day(-r.h.length)}</text><text x="${W}" y="${H - 6}" text-anchor="end" style="fill:var(--muted);font:12px var(--f)">${day(-1)}</text></svg>`;
  return s;

  <div class="panel" style="padding-top:12px"><div class="kv">
    <div><span>Average Daily Usage</span><b>${f(p.adu * (S.daf[S.srl] || 1))}</b></div><div><span>Decoupled Lead Time</span><b>${x.D} days</b></div>
    <div><span>Safety Stock</span><b>${f(b.ss)}</b></div><div><span>Reorder Point</span><b>${f(b.rop)}</b></div><div><span>Maximum Stock</span><b>${f(b.max)}</b></div>
    <div><span>On-Hand Stock</span><b>${f(x.oh)}</b></div><div><span>Open Supply</span><b>${f(x.os)}</b></div><div><span>Open Demand (past + today)</span><b>${f(x.od)}</b></div>
    <div><span>Qualified Spike Demand</span><b>${f(x.qs)}</b></div><div><span>Net Flow Position</span><b>${f(x.n)}</b></div><div><span>Planning Priority</span><b>${zpill(x.zone)} ${x.pr.toFixed(1)}%</b></div>
    <div><span>Spike Threshold / Horizon</span><b>${f(x.thr)} / ${x.hz} days ${x.pp.prod ? "(product)" : "(plant)"}</b></div></div></div></div>
  <div class="card"><div class="tb"><h2>Elements</h2></div><div class="tw"><table><tr><th>Date</th><th>MRP Element</th><th class="n">Receipt / Requirement</th><th class="n">Available Quantity</th></tr>
  ${el.map(e => { avail += e.q; return `<tr><td>${e.d ? day(e.d) : day(0) + " (today)"}</td><td>${e.t}</td><td class="n">${e.q > 0 ? "+" : ""}${f(e.q)}</td><td class="n">${f(avail)}</td></tr>`; }).join("")}</table></div></div>
  ${note("Step 4", "The stock/requirements list shows every value the planning run uses for MRP procedure C on its Demand-Driven Replenishment tab. Average daily consumption is not listed as an element; it only drives the buffer zones.", SRC3.proc)}`;
  $("#sp", fb).onchange = e => { S.srl = e.target.value; go(cur); };
}

const SCHED = `<div class="sec">Scheduling Options</div><div class="panel fb"><label class="chk"><input type="checkbox" checked disabled>Start Immediately</label><label class="fld">Recurrence Pattern<select data-rec><option>Single Run</option><option>Daily</option><option>Weekly</option><option>Monthly</option></select></label></div>`;
function recText(ct) {
  const r = (ct.querySelector("[data-rec]") || {}).value || "Single Run";
  if (r === "Single Run") return "";
  const n = { Daily: 1, Weekly: 7, Monthly: 30 }[r];
  return ` · ${r}, next run ${day(n)}`;
}
const goT = t => go(SCR.findIndex(s => s.t === t));

$("#av").onclick = e => {
  e.stopPropagation();
  const m = document.createElement("div"); m.className = "menu"; m.innerHTML = `<button type="button" id="mcards">Manage Cards</button><button type="button" id="aset">App Settings</button>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener("click", close); };
  setTimeout(() => document.addEventListener("click", close), 0);
  $("#aset", m).onclick = () => {
    close();
    dialog("App Settings", `<div style="width:100%"><b>Area of Responsibility</b><div class="note" style="border:0;padding:4px 0 8px">Plant / MRP Controller combinations used by Buffer Positioning and Historical Buffer Performance.</div>
      <div class="tw"><table><tr><th>Plant</th><th>MRP Controller</th><th>Assigned</th></tr><tr><td>${PLANT}</td><td>001</td><td><input type="checkbox" id="aor1" ${S.aor.length ? "checked" : ""} aria-label="Assign plant ${PLANT}, MRP controller 001"></td></tr></table></div></div>`, L => {
      S.aor = $("#aor1", L).checked ? [{ plant: PLANT, mrpc: "001" }] : []; toast("App settings saved"); go(cur);
    });
  };
  $("#mcards", m).onclick = () => {
    close();
    const L = dialog("Manage Cards", `<div style="width:100%">${S.cardOrder.map(k => `<label class="sw"><span>${OVC[k].t}</span><input type="checkbox" data-sw="${k}" ${S.cardOn[k] ? "checked" : ""}></label>`).join("")}</div><button class="btn t" type="button" id="restore">Restore</button>`, Lr => {
      Lr.querySelectorAll("[data-sw]").forEach(c => S.cardOn[c.dataset.sw] = c.checked);
      if (SCR[cur].t === "Planner Overview") go(cur); else goT("Planner Overview");
    });
    $("#restore", L).onclick = () => { S.cardOrder = ["blm", "rp", "re"]; S.cardOn = { blm: true, rp: true, re: true }; S.ovBd = { blm: "efg", rp: "abc", re: "xyz" }; L.innerHTML = ""; goT("Planner Overview"); toast("Default view restored"); };
  };
};

/* demo seed: all set-up jobs already run, so every screen shows data */
S.cls = classify(); S.jobs.unshift("Product Classification (DD) 1");
S.buf["SFG-200"] = { ss: 3200, rop: 7500, max: 10000 }; S.mrp["SFG-200"] = "D1"; S.lot["SFG-200"] = "H1"; S.sim = true;
S.efg = Object.fromEntries(ddList().map(id => [id, efgOf(id)])); S.jobs.unshift("Lead Time Classification of Products (DD) 2");
runProposals();
document.addEventListener("keydown", e => {
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t && (t.matches && (t.matches("tr.click") || t.matches("[data-n]")))) { e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  if (e.key === "Escape" && $("#layer").innerHTML) $("#layer").innerHTML = "";
});
go(0);
})();
</script>
